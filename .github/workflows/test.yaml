name: Test

on:
  workflow_dispatch:

# Права для публикации отчета в ветку gh-pages
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Выкачиваем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Выдаем права на запуск gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. Поднимаем Selenoid
      - name: Start Selenoid
        uses: Xotabu4/selenoid-github-action@v2

      # 5. Запускаем тесты
      - name: Run tests
        run: ./gradlew clean test -Dselenide.remote=http://localhost:4444/wd/hub

      # 6. Скачиваем историю тестов из ветки gh-pages
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 7. Генерируем Allure отчет
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: build/allure-results
          allure_report: allure-report
          allure_history: allure-history

      # 8. Публикуем отчет в GitHub Pages
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history